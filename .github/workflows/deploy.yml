name: Build, testes e deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Teste ponta a ponta (Playwright)
        run: npm run e2e -- --trace off
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Publica só a partir do branch padrão do repositório.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
